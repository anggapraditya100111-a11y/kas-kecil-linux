<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Kas Kecil</title>
  <link rel="stylesheet" href="/styles.css?v=1.7.1">
  <script src="/app.js?v=1.7.1" defer></script>
</head>
<body>
  <section id="public-approval-view" class="public-approval-wrap hidden">
    <div class="public-approval-shell">
      <div class="brand public-brand">
        <div class="brand-mark"><img class="brand-logo hidden" data-brand-logo alt="Logo perusahaan"><span data-brand-fallback>AK</span></div>
        <div><h1 data-brand-app>Approval Kas Kecil</h1><p data-brand-company>Nama Perusahaan</p></div>
        <button class="btn btn-ghost btn-sm theme-toggle" type="button" aria-label="Ubah mode tampilan">Mode gelap</button>
      </div>
      <main id="public-approval-page" class="public-approval-page"></main>
    </div>
  </section>

  <section id="login-view" class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="brand">
        <div class="brand-mark"><img class="brand-logo hidden" data-brand-logo alt="Logo perusahaan"><span data-brand-fallback>AK</span></div>
        <div><h1 data-brand-app>Aplikasi Kas Kecil</h1><p data-brand-company>Nama Perusahaan</p></div>
        <button class="btn btn-ghost btn-sm theme-toggle login-theme-toggle" type="button" aria-label="Ubah mode tampilan">Mode gelap</button>
      </div>
      <h2>Masuk</h2>
      <p id="login-description">Gunakan AXINDO ID untuk membuka aplikasi.</p>
      <div id="access-login-area" class="access-login-area hidden">
        <button id="access-login-button" class="btn btn-primary btn-block" type="button">Masuk dengan AXINDO ID</button>
        <small id="access-login-status" class="muted"></small>
      </div>
      <button id="local-login-toggle" class="btn btn-ghost btn-block hidden" type="button">Login Super User darurat</button>
      <div id="local-login-area">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
        <button class="btn btn-ghost btn-block" type="submit">Masuk dengan akun lokal</button>
      </div>
    </form>
  </section>

  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="topbar-left"><button id="menu-toggle" class="btn btn-ghost mobile-menu-button" type="button" aria-label="Buka menu">☰</button><div class="brand"><div class="brand-mark"><img class="brand-logo hidden" data-brand-logo alt="Logo perusahaan"><span data-brand-fallback>AK</span></div><div><h1 id="app-name">Aplikasi Kas Kecil</h1><p id="company-name">Nama Perusahaan</p></div></div></div>
      <div class="mobile-top-actions">
        <button id="mobile-activity-shortcut" class="mobile-icon-button" type="button" aria-label="Buka aktivitas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="mobile-approval-count" class="mobile-notification-dot hidden"></span>
        </button>
        <button id="mobile-profile-shortcut" class="mobile-avatar" type="button" aria-label="Buka akun"><span id="user-initial">A</span></button>
      </div>
      <div class="topbar-user"><button class="btn btn-ghost btn-sm theme-toggle" type="button" aria-label="Ubah mode tampilan">Mode gelap</button><div class="user-copy"><strong id="user-name"></strong><span id="user-role"></span></div><button id="logout-button" class="btn btn-ghost btn-sm">Keluar</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar"><nav id="navigation"></nav><footer class="sidebar-footer"><span id="sidebar-version">Versi -</span><span>Create By Apraditya</span></footer></aside>
      <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="Tutup menu"></button>
      <main id="page"></main>
    </div>
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Navigasi utama">
      <button type="button" data-mobile-page="dashboard" aria-label="Beranda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3z"/></svg><span>Beranda</span>
      </button>
      <button type="button" data-mobile-page="mutations" aria-label="Mutasi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1-3 1.5L9 20l-2 1zM9 8h6M9 12h6M9 16h4"/></svg><span>Mutasi</span>
      </button>
      <button id="mobile-transaction-button" class="mobile-transaction-button" type="button" aria-label="Buat transaksi">
        <span class="mobile-fab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Transaksi</span>
      </button>
      <button type="button" data-mobile-page="activity" aria-label="Aktivitas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>Aktivitas</span>
      </button>
      <button type="button" data-mobile-page="profile" aria-label="Akun">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10"/></svg><span>Akun</span>
      </button>
    </nav>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><button id="modal-close" class="modal-close" aria-label="Tutup">×</button><div id="modal-body"></div></div>
  </div>
  <div id="loading" class="loading hidden"><div class="spinner"></div></div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
