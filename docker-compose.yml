name: kas-kecil

services:
  kas-kecil:
    build:
      context: .
      dockerfile: Dockerfile
    image: kas-kecil:1.7.3
    container_name: kas-kecil
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:8090"
    environment:
      NODE_ENV: production
      PORT: 8090
      TZ: Asia/Jakarta
      APP_PEPPER: "${APP_PEPPER}"
      INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-Administrator}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      DEFAULT_APP_NAME: "${DEFAULT_APP_NAME:-Aplikasi Kas Kecil}"
      DEFAULT_COMPANY_NAME: "${DEFAULT_COMPANY_NAME:-Nama Perusahaan}"
      SERVICE_NAME: "${SERVICE_NAME:-kas-kecil}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MOBILE_SESSION_DAYS: "${MOBILE_SESSION_DAYS:-30}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-https://kaskecil.axindo.my.id}"
      ACCESS_HANDOFF_ENABLED: "${ACCESS_HANDOFF_ENABLED:-false}"
      ACCESS_PORTAL_URL: "${ACCESS_PORTAL_URL:-https://akses.axindo.my.id}"
      ACCESS_PORTAL_INTERNAL_URL: "${ACCESS_PORTAL_INTERNAL_URL:-http://host.docker.internal:8096}"
      LOCAL_SUPER_USER_LOGIN_ENABLED: "${LOCAL_SUPER_USER_LOGIN_ENABLED:-true}"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DATA_ROOT:-/var/lib/kas-kecil}/database:/app/data"
      - "${DATA_ROOT:-/var/lib/kas-kecil}/uploads:/app/uploads"
      - "${DATA_ROOT:-/var/lib/kas-kecil}/backups:/app/backups"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
